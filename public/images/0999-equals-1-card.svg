<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5eef8"/>
      <stop offset="100%" stop-color="#e8d8e0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g stroke="#c8b0c0" stroke-width="0.4" opacity="0.35">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="100" y1="0" x2="100" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="500" y1="0" x2="500" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
    <line x1="700" y1="0" x2="700" y2="500"/>
  </g>

  <!-- Kicker -->
  <text x="400" y="110" font-family="Georgia, serif" font-size="11" fill="#9a7a8a" text-anchor="middle" letter-spacing="0.22em">MATHEMATICS · PROOF · REAL ANALYSIS</text>

  <!-- Main equation - big -->
  <text x="400" y="240" font-family="'Courier New', Courier, monospace" font-size="88" font-weight="700" fill="#2a1a22" text-anchor="middle" letter-spacing="-2">0.999… = 1</text>

  <!-- Subtitle -->
  <text x="400" y="300" font-family="Georgia, serif" font-size="17" font-style="italic" fill="#7a5a6a" text-anchor="middle" letter-spacing="0.02em">Not approximately. Exactly.</text>

  <!-- Geometric series hint -->
  <text x="400" y="355" font-family="'Courier New', Courier, monospace" font-size="13.5" fill="#9a7a8a" text-anchor="middle" opacity="0.85">= (9/10) · 1/(1 − 1/10) = (9/10) · (10/9) = 1</text>

  <!-- Divider line -->
  <line x1="310" y1="378" x2="490" y2="378" stroke="#b890a8" stroke-width="1"/>

  <!-- QED -->
  <text x="400" y="400" font-family="'Courier New', Courier, monospace" font-size="12" fill="#b890a8" text-anchor="middle" letter-spacing="0.1em">■ Q.E.D.</text>

  <!-- Corner marks -->
  <line x1="40" y1="40" x2="70" y2="40" stroke="#c090a8" stroke-width="1.2" opacity="0.7"/>
  <line x1="40" y1="40" x2="40" y2="70" stroke="#c090a8" stroke-width="1.2" opacity="0.7"/>
  <line x1="760" y1="40" x2="730" y2="40" stroke="#c090a8" stroke-width="1.2" opacity="0.7"/>
  <line x1="760" y1="40" x2="760" y2="70" stroke="#c090a8" stroke-width="1.2" opacity="0.7"/>
  <line x1="40" y1="460" x2="70" y2="460" stroke="#c090a8" stroke-width="1.2" opacity="0.7"/>
  <line x1="40" y1="460" x2="40" y2="430" stroke="#c090a8" stroke-width="1.2" opacity="0.7"/>
  <line x1="760" y1="460" x2="730" y2="460" stroke="#c090a8" stroke-width="1.2" opacity="0.7"/>
  <line x1="760" y1="460" x2="760" y2="430" stroke="#c090a8" stroke-width="1.2" opacity="0.7"/>

  <!-- Floating decorative fractions, faint -->
  <text x="68" y="230" font-family="Georgia, serif" font-size="28" fill="#c8a0b8" opacity="0.4" font-style="italic">9/10</text>
  <text x="670" y="195" font-family="Georgia, serif" font-size="22" fill="#c8a0b8" opacity="0.3" font-style="italic">r = 1/10</text>
  <text x="52" y="340" font-family="Georgia, serif" font-size="18" fill="#c8a0b8" opacity="0.3" font-style="italic">|r| &lt; 1</text>
  <text x="685" y="350" font-family="Georgia, serif" font-size="18" fill="#c8a0b8" opacity="0.3" font-style="italic">∞</text>
</svg>
