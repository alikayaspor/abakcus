      <svg viewBox="0 0 680 340" xmlns="http://www.w3.org/2000/svg" style="display:block;width:100%;background:#e6e0d4;">
        <defs>
          <style>
            .grid-line { stroke: #45403a; stroke-width: 0.8; fill: none; opacity: 0.55; }
            .grid-line-hi { stroke: #16120c; stroke-width: 1.3; fill: none; opacity: 0.7; }
            .surface-fill { fill: none; }
          </style>
        </defs>

        <!-- Title -->
        <text x="340" y="26" font-family="'DM Mono', monospace" font-size="8" fill="#8c8680" letter-spacing="2" text-anchor="middle" text-transform="uppercase">HYPERBOLIC PARABOLOID</text>

        <!-- Center of drawing -->
        <!-- We render the saddle surface z = x²/a² - y²/b² as a projected 3D grid -->
        <!-- Using isometric-style projection: screen_x = cx + (x - y)*cos30, screen_y = cy - z + (x + y)*sin30 -->

        <g id="surface">
          <!-- Grid lines in x direction (y varies, x fixed) -->
          <!-- We'll generate the grid with precomputed points for a = b = 2.5, grid from -5 to 5 -->
          <!-- Projection: sx = 340 + (ix - iy)*28, sy = 200 - iz*22 + (ix + iy)*14 -->
          <!-- iz = ix^2/6.25 - iy^2/6.25 where ix,iy in [-5..5] step 1 -->

          <!-- x-constant lines (vertical slices = parabolas in x direction) -->
          <polyline class="grid-line" points="136,270 146,240 158,215 172,194 188,178 206,167 224,162 242,162 260,167 278,178 296,194 314,215 332,240 350,270"/>
          <polyline class="grid-line" points="150,256 160,228 172,205 186,186 202,171 220,161 238,156 256,157 274,162 292,172 310,187 328,207 346,232 364,262"/>
          <polyline class="grid-line" points="164,242 174,216 186,194 200,178 216,165 234,157 252,153 270,154 288,160 306,171 324,187 342,208 360,234 378,264"/>
          <polyline class="grid-line" points="178,228 188,204 200,183 214,166 230,154 248,147 266,144 284,147 302,155 320,168 338,186 356,209 374,236 392,268"/>
          <polyline class="grid-line-hi" points="192,214 202,192 214,172 228,156 244,145 262,138 280,136 298,140 316,149 334,163 352,182 370,206 388,234 406,267"/>
          <polyline class="grid-line" points="206,200 216,180 228,162 242,148 258,137 276,131 294,130 312,135 330,145 348,160 366,179 384,204 402,233 420,266"/>
          <polyline class="grid-line" points="220,186 230,168 242,152 256,139 272,129 290,124 308,124 326,130 344,140 362,156 380,176 398,201 416,231 434,265"/>
          <polyline class="grid-line" points="234,172 244,156 256,141 270,130 286,121 304,117 322,118 340,125 358,136 376,153 394,174 412,200 430,230 448,264"/>
          <polyline class="grid-line" points="248,158 258,144 270,130 284,121 300,113 318,110 336,112 354,120 372,132 390,150 408,172 426,199 444,230 462,264"/>
          <polyline class="grid-line" points="262,144 272,132 284,119 298,111 314,105 332,103 350,106 368,115 386,128 404,147 422,170 440,198 458,230 476,264"/>
          <polyline class="grid-line-hi" points="276,130 286,120 298,109 312,102 328,97 346,96 364,100 382,110 400,124 418,144 436,168 454,198 472,230 490,265"/>

          <!-- y-constant lines (horizontal slices = parabolas in y direction, appear as hyperbolas in x) -->
          <polyline class="grid-line" points="136,270 150,256 164,242 178,228 192,214 206,200 220,186 234,172 248,158 262,144 276,130"/>
          <polyline class="grid-line" points="146,240 160,228 174,216 188,204 202,192 216,180 230,168 244,156 258,144 272,132 286,120"/>
          <polyline class="grid-line" points="158,215 172,205 186,194 200,183 214,172 228,162 242,152 256,141 270,130 284,119 298,109"/>
          <polyline class="grid-line" points="172,194 186,186 200,178 214,166 228,156 242,148 256,139 270,130 284,121 298,111 312,102"/>
          <polyline class="grid-line" points="188,178 202,171 216,165 230,154 244,145 258,137 272,129 286,121 300,113 314,105 328,97"/>
          <polyline class="grid-line-hi" points="206,167 220,161 234,157 248,147 262,138 276,131 290,124 304,117 318,110 332,103 346,96"/>
          <polyline class="grid-line" points="224,162 238,156 252,153 266,144 280,136 294,130 308,124 322,118 336,112 350,106 364,100"/>
          <polyline class="grid-line" points="242,162 256,157 270,154 284,147 298,140 312,135 326,130 340,125 354,120 368,115 382,110"/>
          <polyline class="grid-line" points="260,167 274,162 288,160 302,155 316,149 330,145 344,140 358,136 372,132 386,128 400,124"/>
          <polyline class="grid-line" points="278,178 292,172 306,171 320,168 334,163 348,160 362,156 376,153 390,150 404,147 418,144"/>
          <polyline class="grid-line-hi" points="296,194 310,187 324,187 338,186 352,182 366,179 380,176 394,174 408,172 422,170 436,168"/>

          <!-- a few "straight line" rulings to show it's a ruled surface -->
          <line x1="136" y1="270" x2="490" y2="265" stroke="#16120c" stroke-width="0.6" stroke-dasharray="4,3" opacity="0.3"/>
          <line x1="350" y1="270" x2="276" y2="130" stroke="#16120c" stroke-width="0.6" stroke-dasharray="4,3" opacity="0.3"/>
        </g>

        <!-- Equation labels -->
        <g font-family="'EB Garamond', Georgia, serif" fill="#16120c">
          <!-- z = x²/a² - y²/b² -->
          <text x="60" y="300" font-size="16" font-style="italic">z =</text>
          <!-- x² / a² -->
          <text x="88" y="293" font-size="13" font-style="italic">x</text>
          <text x="93" y="288" font-size="9" font-style="italic">2</text>
          <line x1="88" y1="296" x2="100" y2="296" stroke="#16120c" stroke-width="0.8"/>
          <text x="89" y="308" font-size="13" font-style="italic">a</text>
          <text x="95" y="304" font-size="9" font-style="italic">2</text>
          <!-- minus -->
          <text x="106" y="300" font-size="16">−</text>
          <!-- y² / b² -->
          <text x="120" y="293" font-size="13" font-style="italic">y</text>
          <text x="126" y="288" font-size="9" font-style="italic">2</text>
          <line x1="120" y1="296" x2="133" y2="296" stroke="#16120c" stroke-width="0.8"/>
          <text x="121" y="308" font-size="13" font-style="italic">b</text>
          <text x="127" y="304" font-size="9" font-style="italic">2</text>
        </g>

        <!-- Constraint label -->
        <g font-family="'EB Garamond', Georgia, serif" fill="#45403a">
          <text x="150" y="300" font-size="14" font-style="italic">,</text>
          <text x="160" y="293" font-size="11" font-style="italic">x</text>
          <text x="166" y="289" font-size="8" font-style="italic">2</text>
          <line x1="160" y1="296" x2="175" y2="296" stroke="#45403a" stroke-width="0.7"/>
          <text x="160" y="307" font-size="11" font-style="italic">a</text>
          <text x="166" y="303" font-size="8" font-style="italic">2</text>
          <text x="178" y="300" font-size="14">+</text>
          <text x="190" y="293" font-size="11" font-style="italic">y</text>
          <text x="196" y="289" font-size="8" font-style="italic">2</text>
          <line x1="190" y1="296" x2="205" y2="296" stroke="#45403a" stroke-width="0.7"/>
          <text x="191" y="307" font-size="11" font-style="italic">b</text>
          <text x="197" y="303" font-size="8" font-style="italic">2</text>
          <text x="208" y="300" font-size="14">&lt; 1</text>
        </g>

        <!-- Annotations -->
        <g font-family="'DM Mono', monospace" font-size="7.5" fill="#8c8680" letter-spacing="0.5">
          <!-- Curvature up label -->
          <text x="490" y="178" text-anchor="start">CURVES UP</text>
          <text x="490" y="188" text-anchor="start">( + z )</text>
          <line x1="488" y1="180" x2="462" y2="165" stroke="#8c8680" stroke-width="0.7"/>

          <!-- Curvature down label -->
          <text x="490" y="258" text-anchor="start">CURVES DOWN</text>
          <text x="490" y="268" text-anchor="start">( − z )</text>
          <line x1="488" y1="259" x2="462" y2="264" stroke="#8c8680" stroke-width="0.7"/>

          <!-- Saddle point -->
          <text x="248" y="100" text-anchor="middle">SADDLE POINT</text>
          <text x="248" y="111" text-anchor="middle">( minimum · maximum )</text>
          <line x1="270" y1="118" x2="290" y2="127" stroke="#8c8680" stroke-width="0.7"/>

          <!-- Ruled surface note -->
          <text x="80" y="170" text-anchor="middle">RULED SURFACE:</text>
          <text x="80" y="181" text-anchor="middle">STRAIGHT LINES LIE</text>
          <text x="80" y="192" text-anchor="middle">ALONG THE CURVE</text>
          <line x1="100" y1="178" x2="135" y2="200" stroke="#8c8680" stroke-width="0.7" stroke-dasharray="2,2"/>
        </g>
      </svg>
